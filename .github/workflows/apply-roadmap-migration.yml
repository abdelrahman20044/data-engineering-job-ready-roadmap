name: Apply roadmap migration

on:
  push:
    branches: [main]
    paths:
      - roadmap-migration.patch

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply validated roadmap commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git am roadmap-migration.patch
          git rm roadmap-migration.patch .github/workflows/apply-roadmap-migration.yml
          git commit --amend --no-edit
          git push origin HEAD:main
